services:
  bot:
    # Outline reaches the bot by this name in the public network: http://endpoint-wiki-bot:8080/webhook
    hostname: endpoint-wiki-bot
    build: .
    restart: always
    init: true
    stop_grace_period: 30s
    networks:
      - public
    env_file:
      - .env
    environment:
      STATE_FILE: /app/data/state.json
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:${PORT:-8080}/healthz || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 20s
networks:
  public:
    name: public
    external: true
